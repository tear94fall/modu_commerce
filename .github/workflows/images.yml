# 컨테이너 이미지 빌드·푸시.
#   PR(develop·master 대상)        → 바뀐 서비스만 테스트 + 이미지 빌드(푸시 없음)
#   develop·master 푸시            → 바뀐 서비스만 테스트 + 빌드 + GHCR 푸시
#   수동 실행(workflow_dispatch)    → 모든 서비스(develop·master 에서 돌리면 푸시도 한다)
# 이미지: ghcr.io/tear94fall/modu-commerce/<service>
# 태그:   develop → develop-<sha7> + develop / master → master-<sha7> + latest
# Dockerfile 은 compose 의 로컬 빌드(up -d --build)와 같은 파일이다. 테스트는 Dockerfile 이 아니라 여기서 돈다.
name: images

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 어떤 서비스의 디렉터리가 바뀌었는지 본다. 수동 실행이면 전부.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            commerce-service:
              - 'backend/commerce-service/**'
            web:
              - 'web/**'
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'services=["commerce-service","web"]' >> "$GITHUB_OUTPUT"
          else
            echo 'services=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    concurrency:
      group: images-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: true
    env:
      IMAGE: ghcr.io/tear94fall/modu-commerce/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      # ── 테스트: Spring(commerce-service) ──
      - if: matrix.service == 'commerce-service'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.service == 'commerce-service'
        uses: gradle/actions/setup-gradle@v4
      - if: matrix.service == 'commerce-service'
        name: ktlint + test
        working-directory: backend/commerce-service
        run: ./gradlew ktlintCheck test

      # ── 테스트: 웹(vitest) ──
      - if: matrix.service == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: matrix.service == 'web'
        name: npm ci + test
        working-directory: web
        run: |
          npm ci
          npm test

      # ── 이미지 ──
      - uses: docker/setup-buildx-action@v3
      - if: (github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 브랜치 이름-짧은 sha, 그리고 develop 은 develop / master 는 latest 로도 민다. PR 은 pr-<n>(푸시 안 함).
          tags: |
            type=sha,prefix=${{ github.ref_name }}-,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'web' && 'web' || format('backend/{0}', matrix.service) }}
          platforms: linux/amd64
          push: ${{ (github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
