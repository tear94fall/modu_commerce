services:
  mysql-commerce:
    image: mysql:8.0
    container_name: mysql-commerce
    ports:
      - 3316:3306
    volumes:
      - mysql-commerce:/var/lib/mysql
    environment:
      MYSQL_DATABASE: commerce
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: ${COMMERCE_DB_PASSWORD:-commerce}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 2s
      retries: 30
    restart: always

  commerce-service:
    build:
      context: ./commerce-service
      dockerfile: ./Dockerfile
    container_name: commerce-service
    ports:
      - 8200:8200
    environment:
      - DB_MASTER_URL=jdbc:mysql://mysql-commerce:3306/commerce?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - DB_MASTER_USERNAME=root
      - DB_MASTER_PASSWORD=${COMMERCE_DB_PASSWORD:-commerce}
      # 모두의 채팅 auth-service (게이트웨이 경유). 컨테이너에서 호스트 LAN IP 로 나간다.
      - MODU_OAUTH_ISSUER=${MODU_OAUTH_ISSUER:-http://192.168.0.3:8000/auth-service}
      - MODU_OAUTH_JWKS_URI=${MODU_OAUTH_JWKS_URI:-http://192.168.0.3:8000/auth-service/oauth2/jwks}
    depends_on:
      mysql-commerce:
        condition: service_healthy
    restart: always

volumes:
  mysql-commerce:
