name: modu-commerce

# mysql-commerce 등 인프라는 ~/workspace/modu_infra/data 에서 먼저 띄운다.
# commerce-service 는 external 네트워크 modu-infra 에서 컨테이너 이름으로 인프라·플랫폼(config-service)·auth-service 에 접근한다.
# 기동 순서: modu_infra → modu_platform → modu_chat backend(gateway) → 이 스택. 설정을 못 받으면 기동에 실패하고 restart 가 다시 띄운다.
# 커머스 웹(../web)도 여기서 같이 뜬다: nginx 가 정적 빌드를 서빙하고 /api-public(옛 /api/v1) → gateway-service /commerce-service/api-public, /auth-service → gateway-service 로 프록시한다.
# commerce-service 는 discovery-service(modu_platform, 같은 modu-infra 네트워크)에 commerce-service 로 등록되고 게이트웨이가 lb://COMMERCE-SERVICE 로 부른다.

services:
  commerce-service:
    build:
      context: ./commerce-service
      dockerfile: ./Dockerfile
    container_name: commerce-service
    ports:
      - 8200:8200
    environment:
      # 접속 정보·OAuth 검증 주소는 modu_platform 의 config-service(commerce/commerce-service.yml + 공통)가 내려준다.
      - CONFIG_SERVER_URI=http://config-service:8888
      # 마이 탭 포인트 조회가 point-service(/api-internal) 를 부를 때 쓰는 서비스 간 토큰.
      # 이 디렉터리의 .env(커밋 안 함)에 modu_chat backend/.env 와 같은 INTERNAL_API_TOKEN 을 둔다.
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-modu-internal-dev-token}
      # 푸시 캠페인용 Firebase 서비스 계정 키. ./secrets/firebase-service-key.json(커밋 안 함)을 둔다. 없으면 로그만 남긴다.
      - MODU_PUSH_FIREBASE_CREDENTIALS=/secrets/firebase-service-key.json
    volumes:
      # 파일이 아니라 디렉터리를 마운트한다(없는 파일을 마운트하면 도커가 그 자리에 디렉터리를 만든다).
      - ./secrets:/secrets:ro
    networks:
      - modu-infra
    # 준비 검사: readiness(readinessState + master DB). amazoncorretto:21 에 curl 이 있다. 설정 서버·Eureka·JPA 기동을 기다리므로 start_period 를 길게.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    # SIGTERM 뒤 처리 중인 요청을 끝낼 시간(spring.lifecycle.timeout-per-shutdown-phase 20s 보다 길게).
    stop_grace_period: 30s
    restart: always

  modu-commerce-web:
    build:
      context: ../web
      dockerfile: ./Dockerfile
    container_name: modu-commerce-web
    ports:
      - "${COMMERCE_WEB_PORT:-8082}:80"
    depends_on:
      - commerce-service
    networks:
      - modu-infra
    # nginx 가 정적 파일을 내주는지만 본다(게이트웨이 상태와 무관). nginx:1.27-alpine 에 curl 이 있다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: always

networks:
  modu-infra:
    external: true
