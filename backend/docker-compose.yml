name: modu-commerce

# mysql-commerce 등 인프라는 ~/workspace/modu_infra/data 에서 먼저 띄운다.
# commerce-service 는 external 네트워크 modu-infra 에서 컨테이너 이름으로 인프라와 auth-service 에 접근한다.

services:
  commerce-service:
    build:
      context: ./commerce-service
      dockerfile: ./Dockerfile
    container_name: commerce-service
    ports:
      - 8200:8200
    environment:
      - DB_MASTER_URL=jdbc:mysql://mysql-commerce:3306/commerce?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - DB_MASTER_USERNAME=root
      - DB_MASTER_PASSWORD=${COMMERCE_DB_PASSWORD:-commerce}
      # issuer 는 auth-service 가 발급한 토큰의 iss 클레임과 문자열이 같아야 하므로 게이트웨이 경유 주소를 유지한다.
      - MODU_OAUTH_ISSUER=${MODU_OAUTH_ISSUER:-http://192.168.0.3:8000/auth-service}
      # JWKS 는 modu-infra 네트워크에서 auth-service 에 직접 받는다 (게이트웨이와 같은 주소).
      - MODU_OAUTH_JWKS_URI=${MODU_OAUTH_JWKS_URI:-http://auth-service:9900/oauth2/jwks}
    networks:
      - modu-infra
    restart: always

networks:
  modu-infra:
    external: true
