name: modu-commerce

# mysql-commerce 등 인프라는 ~/workspace/modu_infra/data 에서 먼저 띄운다.
# commerce-service 는 external 네트워크 modu-infra 에서 컨테이너 이름으로 인프라·플랫폼(config-service)·auth-service 에 접근한다.
# 기동 순서: modu_infra → modu_platform → modu_chat backend(gateway) → 이 스택. 설정을 못 받으면 기동에 실패하고 restart 가 다시 띄운다.
# 커머스 웹(../web)도 여기서 같이 뜬다: nginx 가 정적 빌드를 서빙하고 /api-public → gateway-service /commerce-service/api-public, /auth-service → gateway-service 로 프록시한다.
# 서비스 디스커버리는 없다. 게이트웨이는 config-repo 의 modu.services.commerce-service(http://commerce-service:8200, 컨테이너 이름)로 이 서비스를 부르고,
# 이 서비스도 point-service·member-service 를 modu.services.* 의 고정 주소로 부른다. 쿠버네티스에선 같은 이름·포트의 Service 로 맞춘다.

services:
  commerce-service:
    build:
      context: ./commerce-service
      dockerfile: ./Dockerfile
    container_name: commerce-service
    ports:
      - 8200:8200
    environment:
      # 접속 정보·OAuth 검증 주소는 modu_platform 의 config-service(commerce/commerce-service.yml + 공통)가 내려준다.
      - CONFIG_SERVER_URI=http://config-service:8888
      # 서비스 간 토큰·Firebase 키 등 시크릿은 전부 config-service 가 내려준다(modu_platform README '시크릿 지도'). 이 디렉터리에 .env 는 필요 없다.
    networks:
      - modu-infra
    # 준비 검사: readiness(readinessState + master DB). amazoncorretto:21 에 curl 이 있다. 설정 서버·JPA 기동을 기다리므로 start_period 를 길게.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    # SIGTERM 뒤 처리 중인 요청을 끝낼 시간(spring.lifecycle.timeout-per-shutdown-phase 20s 보다 길게).
    stop_grace_period: 30s
    restart: always

  modu-commerce-web:
    build:
      context: ../web
      dockerfile: ./Dockerfile
    container_name: modu-commerce-web
    ports:
      - "${COMMERCE_WEB_PORT:-8082}:80"
    depends_on:
      - commerce-service
    networks:
      - modu-infra
    # nginx 가 정적 파일을 내주는지만 본다(게이트웨이 상태와 무관). nginx:1.27-alpine 에 curl 이 있다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: always

networks:
  modu-infra:
    external: true
