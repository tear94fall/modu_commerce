name: modu-commerce

# mysql-commerce 등 인프라는 ~/workspace/modu_infra/data 에서 먼저 띄운다.
# commerce-service 는 external 네트워크 modu-infra 에서 컨테이너 이름으로 인프라·플랫폼(config-service)·auth-service 에 접근한다.
# 기동 순서: modu_infra → modu_platform → modu_chat backend(gateway) → 이 스택. 설정을 못 받으면 기동에 실패하고 restart 가 다시 띄운다.
# 커머스 웹(../web)도 여기서 같이 뜬다: nginx 가 정적 빌드를 서빙하고 /api-public → gateway-service /commerce-service/api-public, /auth-service → gateway-service 로 프록시한다.
# 서비스 디스커버리는 없다. 게이트웨이는 config-repo 의 modu.services.commerce-service(http://commerce-service:8200, 컨테이너 이름)로 이 서비스를 부르고,
# 이 서비스도 point-service·member-service 를 modu.services.* 의 고정 주소로 부른다. 쿠버네티스에선 같은 이름·포트의 Service 로 맞춘다.

# 이미지: GitHub Actions(.github/workflows/images.yml)가 develop/master 푸시마다 빌드해 GHCR 에 올린다.
#   docker compose pull && docker compose up -d   → CI 이미지(IMAGE_TAG 기본 develop, 예: IMAGE_TAG=develop-abc1234)
#   docker compose up -d --build                  → 로컬 빌드(같은 Dockerfile, 소스에서 jar 까지 만든다)

# 모든 컨테이너 로그 줄에 compose 서비스·프로젝트 이름을 붙인다(json-file attrs). OTel Collector 가 container 필드와 앱/인프라 인덱스 구분에 쓴다(modu_infra monitoring).
x-logging: &logging
  driver: json-file
  options:
    labels: com.docker.compose.service,com.docker.compose.project
    max-size: "50m"
    max-file: "3"

# 컨테이너 메모리 제한. JVM 은 -XX:MaxRAMPercentage=75 로 이 안에서 힙을 잡는다(1g → 힙 최대 768MiB).
# k8s 의 resources.requests(mem_reservation)/limits(mem_limit) 와 같은 값으로 매니페스트에 옮긴다.
x-jvm-resources: &jvm-resources
  mem_limit: 1g
  mem_reservation: 512m
x-small-resources: &small-resources
  mem_limit: 64m
  mem_reservation: 16m

services:
  commerce-service:
    image: ghcr.io/tear94fall/modu-commerce/commerce-service:${IMAGE_TAG:-develop}
    build:
      context: ./commerce-service
      dockerfile: ./Dockerfile
    container_name: commerce-service
    logging: *logging
    <<: *jvm-resources
    mem_limit: 1280m
    ports:
      - 8200:8200
    environment:
      # 접속 정보·OAuth 검증 주소는 modu_platform 의 config-service(commerce/commerce-service.yml + 공통)가 내려준다.
      - CONFIG_SERVER_URI=http://config-service:8888
      # 서비스 간 토큰·Firebase 키 등 시크릿은 전부 config-service 가 내려준다(modu_platform README '시크릿 지도'). 이 디렉터리에 .env 는 필요 없다.
    networks:
      - modu-infra
    # 준비 검사: readiness(readinessState + master DB). amazoncorretto:21 에 curl 이 있다. 설정 서버·JPA 기동을 기다리므로 start_period 를 길게.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    # SIGTERM 뒤 처리 중인 요청을 끝낼 시간(spring.lifecycle.timeout-per-shutdown-phase 20s 보다 길게).
    stop_grace_period: 30s
    restart: always

  modu-commerce-web:
    image: ghcr.io/tear94fall/modu-commerce/web:${IMAGE_TAG:-develop}
    build:
      context: ../web
      dockerfile: ./Dockerfile
    container_name: modu-commerce-web
    logging: *logging
    <<: *small-resources
    ports:
      - "${COMMERCE_WEB_PORT:-8082}:80"
    depends_on:
      - commerce-service
    networks:
      - modu-infra
    # nginx 가 정적 파일을 내주는지만 본다(게이트웨이 상태와 무관). nginx:1.27-alpine 에 curl 이 있다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: always

networks:
  modu-infra:
    external: true
