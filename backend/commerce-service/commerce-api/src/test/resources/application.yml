spring:
  # 테스트는 config-server 를 쓰지 않는다. enabled: false 면 spring.config.import 필수 검사도 통과한다.
  cloud:
    config:
      enabled: false
  datasource:
    master:
      url: jdbc:h2:mem:api;MODE=MYSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver

    replica:
      url: jdbc:h2:mem:api;MODE=MYSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false

# 준비·생존 검사. 이 파일이 main 의 application.yml 을 통째로 대신하므로 같은 값을 둔다(HealthProbeTest).
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, masterDb
        liveness:
          include: livenessState

# 테스트는 discovery-service 에 등록하지 않는다.
eureka:
  client:
    enabled: false

modu:
  oauth:
    issuer: http://auth.test/auth-service
    jwks-uri: http://auth.test/auth-service/oauth2/jwks
    audience: modu-commerce
  internal-api:
    token: test-internal-token
  point:
    url: http://point.test
  member:
    url: http://member.test
  # 푸시: 스케줄러는 끄고(테스트가 runDue 를 직접 부른다) 지금 보내기는 요청 스레드에서 바로 보낸다.
  push:
    firebase-credentials: ""
    scheduler-enabled: false
    async-send: false
  customer:
    terms-version: "2026-10"
  # 등급 스케줄러·적립 재시도는 끄고 테스트가 서비스를 직접 부른다.
  tier:
    scheduler-enabled: false
    earn-retry-enabled: false
