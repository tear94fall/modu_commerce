spring:
  # 테스트는 config-server 를 쓰지 않는다. enabled: false 면 spring.config.import 필수 검사도 통과한다.
  cloud:
    config:
      enabled: false
  datasource:
    master:
      url: jdbc:h2:mem:api;MODE=MYSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver

    replica:
      url: jdbc:h2:mem:api;MODE=MYSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false

modu:
  oauth:
    issuer: http://auth.test/auth-service
    jwks-uri: http://auth.test/auth-service/oauth2/jwks
    audience: modu-commerce
  internal-api:
    token: test-internal-token
  point:
    url: http://point.test
  member:
    url: http://member.test
