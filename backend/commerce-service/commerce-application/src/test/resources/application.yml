spring:
  # 테스트는 config-server 를 쓰지 않는다. enabled: false 면 spring.config.import 필수 검사도 통과한다.
  cloud:
    config:
      enabled: false
  datasource:
    master:
      url: jdbc:h2:mem:app;MODE=MYSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: test-rw-pool
        maximum-pool-size: 3

    replica:
      url: jdbc:h2:mem:app;MODE=MYSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: test-ro-pool
        maximum-pool-size: 3

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug
