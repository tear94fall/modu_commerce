# 커머스 웹 정적 서빙 + API 프록시. 브라우저·WebView 는 같은 출처만 부르므로 서버 CORS 설정이 필요 없다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 카탈로그·장바구니·주문: commerce-service 로 바로.
    location /api/ {
        proxy_pass http://commerce-service:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 토큰 발급·갱신·userinfo: 게이트웨이 뒤의 auth-service. 게이트웨이 CORS 가 다른 출처를 막으므로 Origin 은 지우고 넘긴다.
    location /auth-service/ {
        proxy_pass http://gateway-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_read_timeout 60s;
    }

    # 프로필 사진(공개 다운로드). 게이트웨이는 토큰을 요구하므로 storage-service 로 바로 간다.
    location /storage-service/ {
        proxy_pass http://storage-service:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
