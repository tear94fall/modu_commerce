# 커머스 웹을 도커로 띄운다. commerce-service·gateway-service 와 같은 external 네트워크(modu-infra)에서 컨테이너 이름으로 프록시한다.
# 먼저 modu_infra → modu_platform → modu_chat backend(gateway) → modu_commerce backend 가 떠 있어야 한다.
services:
  modu-commerce-web:
    build: .
    container_name: modu-commerce-web
    ports:
      - "${COMMERCE_WEB_PORT:-8082}:80"
    networks:
      - modu-infra
    restart: unless-stopped

networks:
  modu-infra:
    external: true
